name: docs

# Build the Sphinx documentation and publish it to GitHub Pages.
# Runs on every push to main (and can be run manually).
on:
  push:
    branches: ["main"]
    paths:
      - "geokmeans-py/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # autodoc imports geokmeans, so the package must be installed first.
      # Vendoring + install compiles the extension.
      - name: Vendor C++ sources
        run: python geokmeans-py/sync_sources.py
      - name: Install package + doc deps
        run: |
          pip install ./geokmeans-py
          pip install -r geokmeans-py/docs/requirements.txt

      - name: Build docs
        run: sphinx-build -b html geokmeans-py/docs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
